# /etc/nginx/sites-available/seamwell   — replace every "yourshop.lk" with your domain.
# Enable:  sudo ln -s /etc/nginx/sites-available/seamwell /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d yourshop.lk -d www.yourshop.lk
#          (certbot adds the 443 server + the http → https redirect to this file and renews automatically)
#
# Security headers (CSP with a per-request nonce, HSTS, nosniff, frame-deny…) come from the apps themselves:
# Next.js (apps/web/src/proxy.ts + next.config.ts) and the API (helmet). Nginx only adds them for /uploads.

limit_req_zone $binary_remote_addr zone=sw_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name yourshop.lk www.yourshop.lk;

    client_max_body_size 6m;          # photo uploads (5 MB limit in the API + multipart overhead)
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # API → Node (same origin, so cookies stay first-party)
    location /api/ {
        limit_req zone=sw_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: the API trusts exactly one hop
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Uploaded product / review photos — static files with our own random names only, never executed.
    location ~ "^/uploads/([0-9a-f-]{36}\.(webp|jpg))$" {
        alias /var/www/seamwell/shared/uploads/$1;   # shared across releases (deploy/deploy.sh)
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
    location /uploads/ { return 404; }

    # Next.js build assets — fingerprinted, cache for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else → Next.js (pages are rendered per request because of the CSP nonce — never cache them here)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
