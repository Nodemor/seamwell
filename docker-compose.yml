# Local PostgreSQL for development.
# Start:  npm run db:up      (needs Docker Desktop)
# No Docker? Install PostgreSQL 16+ natively instead — see docs/00-START-HERE.md
services:
  db:
    image: postgres:17-alpine
    container_name: seamwell-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seamwell
      POSTGRES_PASSWORD: seamwell_dev_password
      POSTGRES_DB: seamwell
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - seamwell_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seamwell -d seamwell"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  seamwell_pgdata:
