name: CI / Deploy

# Pull requests: checks only. A merge (push) to main: checks, then deploy to the VPS.
# Deploying needs the "production" environment (secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_HOST_KEY,
# optional VPS_PORT) and the repository variable DEPLOY_ENABLED=true — see docs/07-deployment-vps.md §8.
# Fork pull requests never receive secrets (event "pull_request", never "pull_request_target").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" on main = redeploy the latest main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time public values only (no secrets in CI).
      NEXT_PUBLIC_SITE_URL: https://example.com
      API_INTERNAL_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build API + website
        run: npm run build

      - name: Audit production dependencies (high/critical fail the build)
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to the VPS
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production # secrets live here; GitHub → Settings → Environments → production → branch "main" only
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never cut a deploy off halfway; the next one waits
    steps:
      - name: Prepare the SSH key and the server's identity
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          # Secrets pasted from a web console / Windows often carry \r, stray spaces or wrapped lines — clean them.
          HOST=$(printf '%s' "$HOST" | tr -d '[:space:]')
          PORT=$(printf '%s' "${PORT:-22}" | tr -d '[:space:]'); PORT=${PORT:-22}
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ ! -s ~/.ssh/deploy_key ] || [ "$(tr -d '[:space:]' < ~/.ssh/deploy_key)" = "" ]; then
            echo "::error::VPS_SSH_KEY is empty or missing — add it under Settings → Environments → production → Environment secrets."
            exit 1
          fi
          # -P "" = never prompt. The diagnostics below describe the pasted text without revealing any of it.
          if ! KEY_ERR=$(ssh-keygen -y -P "" -f ~/.ssh/deploy_key 2>&1 >/dev/null); then
            K=~/.ssh/deploy_key
            echo "::error::VPS_SSH_KEY is not a usable private key: ${KEY_ERR:-unknown error}"
            echo "  lines: $(wc -l < "$K") · BEGIN line: $(grep -c -- '-----BEGIN OPENSSH PRIVATE KEY-----' "$K") · END line: $(grep -c -- '-----END OPENSSH PRIVATE KEY-----' "$K")"
            echo "  looks like the PUBLIC (.pub) key instead: $(grep -c '^ssh-ed25519 ' "$K") · protected by a passphrase: $(grep -qi 'passphrase' <<<"$KEY_ERR" && echo yes || echo no)"
            echo "  Fix: copy the whole PRIVATE key file (no .pub, created with an EMPTY passphrase) incl. its BEGIN/END lines."
            exit 1
          fi
          # Pin the server's identity (no trust-on-first-use): VPS_HOST_KEY = the "ssh-ed25519 AAAA…" line from
          # /etc/ssh/ssh_host_ed25519_key.pub on the VPS. Line breaks inside it are removed.
          KEY_B64=$(printf '%s' "$HOST_KEY" | tr -d '\r\n' | awk '{ for (i = 1; i < NF; i++) if ($i == "ssh-ed25519") { print $(i + 1); exit } }')
          if [ -z "$KEY_B64" ]; then
            echo "::error::VPS_HOST_KEY must contain 'ssh-ed25519 AAAA…' (from /etc/ssh/ssh_host_ed25519_key.pub on the VPS)."
            exit 1
          fi
          if [ "$PORT" = 22 ]; then NAME="$HOST"; else NAME="[$HOST]:$PORT"; fi
          printf '%s ssh-ed25519 %s\n' "$NAME" "$KEY_B64" > ~/.ssh/known_hosts
          echo "Server identity expected (compare with: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub):"
          ssh-keygen -lf ~/.ssh/known_hosts
          printf 'HOST=%s\nPORT=%s\n' "$HOST" "$PORT" >> "$GITHUB_ENV"

      - name: Deploy this commit over SSH
        env:
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          USER=$(printf '%s' "$USER" | tr -d '[:space:]')
          # The key is locked on the server to `deploy.sh --from-ssh`, which accepts only "deploy <sha>".
          ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$USER@$HOST" "deploy $GITHUB_SHA"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
